<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声修客 - 专业音频转换</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">

    
        <!-- 新增头部 -->
        <header class="header-wrapper">
            <h1>
                <span class="logo-text">声修客</span>
                <span class="soundwave"></span>
            </h1>
            <p class="subtitle">一站式专业音频处理平台，为您提供极致的体验</p>
            
<!-- 新增访问计数器 -->
<p class="visitor-counter">本站已被点击{{ visitor_count }}次</p>
        </header>

        <!-- 新增功能卡片 -->
        <div class="card-grid">
            <div class="card">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                </div>
                <h3 class="card-title">在线应用</h3>
            </div>

            <div class="card">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </div>
                <h3 class="card-title">格式转换</h3>

            </div>

            <div class="card">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="10 8 16 12 10 16 10 8"/>
                    </svg>
                </div>
                <h3 class="card-title">变速处理</h3>

            </div>
        </div>

        <!-- 原有核心功能区域 -->
        <div class="upload-box" id="drop-zone" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
            <div class="particle-effect"></div>
            <input type="file" id="file-input" hidden accept="audio/*">
            <div class="upload-content">
                <div class="visualizer">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
                <svg class="upload-icon" viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                </svg>
                <p class="drag-instruction">
                    <span>拖放文件至此</span>
                    <span class="divider">|</span>
                    <button onclick="document.getElementById('file-input').click()">浏览文件</button>
                </p>
                <div class="file-meta" id="file-info"></div>
            </div>
        </div>

        <div class="settings-panel">
            <div class="format-select">
                <label>目标格式：</label>
                <select id="format-select">
                    <option value="mp3">MP3</option>
                    <option value="wav">WAV</option>
                    <option value="flac">FLAC</option>
                    <option value="ogg">OGG</option>
                </select>
            </div>
            
            <div class="speed-control">
                <label>播放速度：</label>
                <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeedValue(this.value)">
                <span id="speed-value">1.0x</span>
            </div>
        </div>

      <!--  <button class="convert-btn" onclick="startConversion()">开始转换</button> -->
      
     
<!--<button class="convert-btn" id="convert-btn" onclick="startConversion()">
    <span class="btn-text">开始转换</span>
    <div class="loading-dots hidden">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</button>-->

<div class="button-container">
    <button class="convert-btn" id="convert-btn" onclick="startConversion()">
        <span class="btn-text">开始转换</span>
        <div class="loading-dots hidden">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </button>
    <!--<button class="btn btn-primary" id="test-download-btn">
        下载测试文件
    </button>-->
<button onclick="downloadFile()">点击下载测试文件></button>

<script>
function downloadFile() {
  const link = document.createElement('a');
  link.href = 'https://8.147.232.133:34225/down/PMl66be3fhu5.zip';
  link.download = 'McxYdVhs0uOJ.mp3'; // 自定义保存时的文件名
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
</div>
        
        <div id="progress-bar" class="hidden">
            <div class="progress-fill"></div>
            <span class="progress-text">0%</span>
        </div>
        
        <div id="timer" class="hidden">
            <span class="time-icon">⏱</span>
            <span>转换用时: <span id="time-counter">0</span>秒</span>
        </div>
        
        <div id="error-area" class="hidden"></div>
        <div id="download-area" class="hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
